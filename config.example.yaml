# domain used by user interface
domain: http://127.0.0.1:8080
# http service binding
listen: 127.0.0.1:8080
# debug port binding
debug_listen: 127.0.0.1:8081

# database settings, you can use sqlite or mysql (untested)
database:
  dialect: sqlite
  dsn: ./tapes.db

# Volume-only installations leave this empty. For Tape, add the actual device
# with an sg mapping (see sg_map) and adapt the scripts below to the environment.
tape_devices: []

# working path settings
paths:
  # to save logs and write reports
  work: ./
  # Administrator boundaries; register original/restore directories in Settings -> Locations.
  # An explicit empty list denies access. Ignore uses ordered gitignore rules.
  access:
    - root: /srv/files
      ignore: |
        /private/
    - root: /srv/restored
  # roots that contain already mounted offline Volumes
  volumes:
    - /mnt

# Preview bundles are addressed by content signature.
preview:
  root: ./previews
  generators:
    - kind: image
      extensions: [jpg, jpeg, png, webp, heic]
      options:
        command: ffmpeg
        max_width: 512
        max_height: 512
        format: webp # webp, jpeg, or png
        quality: 80
    - kind: video
      extensions: [mp4, mov, mkv, avi]
      options:
        ffmpeg: ffmpeg
        ffprobe: ffprobe
        poster_width: 512
        poster_height: 512
        timeline_width: 160
        timeline_height: 90
        timeline_interval_seconds: 10
        timeline_max_frames: 100
        format: webp # webp, jpeg, or png
        quality: 75

# Scripts receive TAPE_DIR after the barcode is known. Store LTFS logs and exported indexes there.
# These scripts interact with external software and may need platform-specific changes.
scripts:
  # enable hardware encryption on tape driver
  encrypt: ./scripts/encrypt
  # format ltfs on lto tape, may need to be changed for different ltfs software.
  mkfs: ./scripts/mkfs
  # mount ltfs to specified path, may need to be changed for different ltfs software.
  mount: ./scripts/mount
  # umount ltfs path
  umount: ./scripts/umount
  # read tape barcode for restore jobs
  read_info: ./scripts/readinfo
