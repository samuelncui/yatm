syntax = "proto3";
package copy_status;

option go_package = "github.com/samuelncui/yatm/entity";

enum CopyStatus {
    reserved 2, 255;
    reserved "DRAFT", "RUNNING", "FAILED", "SUBMITED";

    COPY_STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    STAGED = 3;
    SUBMITTED = 4;
    COMPLETED = 5;
}
