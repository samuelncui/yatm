syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "file.proto";

// File operations run within the request lifetime, without creating a Job.
enum FileOperationKind {
  FILE_OPERATION_KIND_UNSPECIFIED = 0;
  FILE_OPERATION_KIND_MOVE = 1;
  FILE_OPERATION_KIND_MKDIR = 3;
  FILE_OPERATION_KIND_REMOVE = 4;
  FILE_OPERATION_KIND_SCAN = 5;
  FILE_OPERATION_KIND_ARCHIVE = 6;
  FILE_OPERATION_KIND_UPDATE_METADATA = 7;
  FILE_OPERATION_KIND_ADMIT = 8;
}

message FileOperationRef {
  oneof target {
    // Library root (0) is valid only as a destination.
    int64 file_id = 1;
    LocationEntryRef location = 2;
  }
}
message FileOperationSpec {
  FileOperationKind kind = 1;
  repeated FileOperationRef sources = 2;
  // Existing directory in the same Library or Location scope as the sources.
  FileOperationRef destination = 3;
  // Required for mkdir; optional replacement name for one move/copy source.
  // Library accepts logical relative paths; Location requires one leaf name.
  string name = 4;
}
enum FileOperationOutcome {
  FILE_OPERATION_OUTCOME_UNSPECIFIED = 0;
  FILE_OPERATION_OUTCOME_UNPROCESSED = 1;
  FILE_OPERATION_OUTCOME_SUCCEEDED = 2;
  FILE_OPERATION_OUTCOME_FAILED = 3;
  // Physical work succeeded, but Library association publication failed.
  FILE_OPERATION_OUTCOME_PUBLICATION_PENDING = 4;
}
message FileOperationEntry {
  int64 id = 1;
  string source_path = 2;
  string target_path = 3;
  bool directory = 4;
  int64 size_bytes = 5;
  FileOperationOutcome outcome = 6;
  string error = 7;
  optional int64 file_id = 8;
}
message FileOperationSummary {
  int64 total_item_count = 1;
  int64 total_bytes = 2;
  int64 succeeded_count = 3;
  int64 failed_count = 4;
  int64 unprocessed_count = 5;
  int64 publication_pending_count = 6;
  // Final response; inspect counts to distinguish success from partial failure.
  bool completed = 7;
  // The request only reported plans: entry paths are the resolved intent and nothing changed.
  bool dryrun = 8;
}
message FileOperationResult {
  FileOperationEntry entry = 1;
  FileOperationSummary summary = 2;
}
