syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "position.proto";
import "media.proto";

service MediaService {
  rpc List(ListMediaRequest) returns (ListMediaResponse) {}
  rpc Inspect(InspectMediaRequest) returns (InspectMediaResponse) {}
  rpc Delete(DeleteMediaRequest) returns (DeleteMediaResponse) {}
  rpc ListPositions(ListMediaPositionsRequest) returns (ListMediaPositionsResponse) {}
  rpc InitializeVolume(InitializeVolumeRequest) returns (InitializeVolumeResponse) {}
  rpc RegisterVolume(RegisterVolumeRequest) returns (RegisterVolumeResponse) {}
  rpc ListVolumeCandidates(ListVolumeCandidatesRequest) returns (ListVolumeCandidatesResponse) {}
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {}
  rpc InspectDevice(InspectDeviceRequest) returns (InspectDeviceResponse) {}
}

message ListMediaRequest {
  oneof param {
    MediaIds ids = 1;
    MediaFilter list = 2;
  }
}

message MediaIds { repeated int64 ids = 1; }

message ListMediaResponse {
  repeated Media media = 1;
  bool has_more = 2;
}

message InspectMediaRequest {
  oneof target {
    InspectMediaTapeTarget tape = 1;
    InspectMediaVolumeTarget volume = 2;
  }
  optional string identity = 17;
}

message InspectMediaTapeTarget { string device = 1; }
message InspectMediaVolumeTarget { string uuid = 1; }

message InspectMediaResponse {
  string identity = 1;
  optional Media media = 2;
  int64 file_count = 3;
  optional int64 last_written_at_ns = 4;
  optional string mount_point = 5;
}

message DeleteMediaRequest {
  repeated int64 ids = 1;
  bool dryrun = 2;
}

message DeleteMediaResponse {
  // Media rows this call deletes; under dryrun, those it would delete.
  int64 media_count = 1;
  // Recorded Positions that lose their Media; under dryrun, those it would lose.
  int64 position_count = 2;
}

message ListMediaPositionsRequest {
  int64 id = 1;
  string directory = 2;
  optional int64 limit = 33;
  optional string after_path = 34;
}

message ListMediaPositionsResponse {
  repeated Position positions = 1;
  bool has_more = 2;
}

message InitializeVolumeRequest {
  string mount_point = 1;
  string name = 2;
  VolumeMediaProfile profile = 3;
}

message InitializeVolumeResponse { Media media = 1; }

message RegisterVolumeRequest {
  string mount_point = 1;
  string name = 2;
}

message RegisterVolumeResponse { Media media = 1; }

// Volume candidate states select the applicable mounted-Volume operation.
enum VolumeCandidateState {
  VOLUME_CANDIDATE_STATE_UNSPECIFIED = 0;
  // No marker: Initialize New creates a new identity.
  VOLUME_CANDIDATE_STATE_UNINITIALIZED = 1;
  // Valid marker without Library Media: Register Existing reuses the marker identity.
  VOLUME_CANDIDATE_STATE_UNREGISTERED = 2;
  VOLUME_CANDIDATE_STATE_REGISTERED = 3;
  // The marker disagrees with the Library, or the identity is mounted more than once.
  VOLUME_CANDIDATE_STATE_CONFLICT = 4;
  // A present marker is unreadable or invalid.
  VOLUME_CANDIDATE_STATE_INVALID = 5;
}

message VolumeCandidate {
  string mount_point = 1;
  // Library Media name when registered, otherwise the discovered directory name.
  string name = 2;
  VolumeCandidateState state = 3;
  // Existing marker profile, or a prefill hint for an uninitialized disk. The probe reports
  // only the serial number, so the caller still chooses the Volume type before initializing.
  optional VolumeMediaProfile profile = 4;
  // The registered Media row; present only for REGISTERED.
  optional Media media = 5;
  // The mount point is a separate filesystem rather than a directory on another one.
  bool separate_filesystem = 6;
  // Reason reported for CONFLICT and INVALID candidates.
  string detail = 7;
}

message ListVolumeCandidatesRequest {}

message ListVolumeCandidatesResponse {
  // Configured Volume discovery roots, empty when none are configured.
  repeated string discovery_roots = 1;
  repeated VolumeCandidate candidates = 2;
}

message ListDevicesRequest {}
message ListDevicesResponse { repeated string devices = 1; }

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_TAPE = 1;
}

// Listing uses configuration and lease state; it never sends SCSI commands.
message DeviceSummary {
  // Configured spelling, retained in operation targets and user-owned scripts.
  string device = 1;
  DeviceKind kind = 2;
  bool busy = 3;
  string detail = 4;
}

message InspectDeviceRequest { string device = 1; }

message InspectDeviceResponse {
  DeviceSummary device = 1;
  // Absent when no hardware observation could be made, for example while busy.
  optional int64 observed_at_ns = 2;
  optional string vendor = 3;
  optional string model = 4;
  optional string firmware = 5;
  optional string serial_number = 6;
  // Access identity unifies OS aliases; it is not a cartridge identity.
  optional string access_identity = 7;
  optional string transport = 8;
  DeviceReason reason = 9;
  string detail = 10;
  oneof report { TapeDeviceReport tape = 17; }
  // Last prepared read in this process, not a claim about the currently loaded cartridge.
  optional TapePreparedRead prepared_read = 18;
}

message TapePreparedRead {
  int64 prepared_at_ns = 1;
  int64 job_id = 2;
  int64 media_id = 3;
  string identity = 4;
  string requested_order = 5;
  string effective_order = 6;
  string parameters_source = 7;
  string parameters_reference = 8;
  string applicability_reason = 9;
  string position_source = 10;
  string coverage_detail = 11;
  // Residuals of the selected learned read parameters over their retained observations.
  optional double learned_mae_seconds = 12;
  optional double learned_max_error_seconds = 13;
}

enum DeviceFeatureKind {
  DEVICE_FEATURE_KIND_UNSPECIFIED = 0;
  DEVICE_FEATURE_KIND_INITIALIZE = 1;
  DEVICE_FEATURE_KIND_SEQUENTIAL_READ = 2;
  DEVICE_FEATURE_KIND_SEQUENTIAL_WRITE = 3;
  DEVICE_FEATURE_KIND_FILEMARKS = 4;
  DEVICE_FEATURE_KIND_NAVIGATION = 5;
  DEVICE_FEATURE_KIND_LOCATE = 6;
  DEVICE_FEATURE_KIND_READ_POSITION = 7;
  DEVICE_FEATURE_KIND_EARLY_WARNING = 8;
  DEVICE_FEATURE_KIND_HARDWARE_COMPRESSION = 9;
  DEVICE_FEATURE_KIND_HARDWARE_DECOMPRESSION = 10;
  DEVICE_FEATURE_KIND_HARDWARE_ENCRYPTION = 11;
  DEVICE_FEATURE_KIND_END_OF_WRAP_POSITION = 12;
  DEVICE_FEATURE_KIND_CAPACITY_TO_WARNING = 13;
  DEVICE_FEATURE_KIND_NON_EJECTING_RELOAD = 14;
  DEVICE_FEATURE_KIND_SOFTWARE_READ_ORDER = 15;
}

enum DeviceFeatureSupport {
  DEVICE_FEATURE_SUPPORT_UNSPECIFIED = 0;
  DEVICE_FEATURE_SUPPORT_UNKNOWN = 1;
  DEVICE_FEATURE_SUPPORT_UNSUPPORTED = 2;
  DEVICE_FEATURE_SUPPORT_PARTIAL = 3;
  DEVICE_FEATURE_SUPPORT_SUPPORTED = 4;
}

enum DeviceFeatureAvailability {
  DEVICE_FEATURE_AVAILABILITY_UNSPECIFIED = 0;
  DEVICE_FEATURE_AVAILABILITY_UNKNOWN = 1;
  DEVICE_FEATURE_AVAILABILITY_UNAVAILABLE = 2;
  DEVICE_FEATURE_AVAILABILITY_READY = 3;
}

// Passive inspection never establishes write/seek/recovery qualification.
enum DeviceFeatureValidation {
  DEVICE_FEATURE_VALIDATION_UNSPECIFIED = 0;
  DEVICE_FEATURE_VALIDATION_UNVALIDATED = 1;
  DEVICE_FEATURE_VALIDATION_VALIDATED = 2;
  DEVICE_FEATURE_VALIDATION_FAILED = 3;
}

enum DeviceReason {
  DEVICE_REASON_UNSPECIFIED = 0;
  DEVICE_REASON_BUSY = 1;
  DEVICE_REASON_NO_MEDIUM = 2;
  DEVICE_REASON_PERMISSION = 3;
  DEVICE_REASON_TRANSPORT_UNAVAILABLE = 4;
  DEVICE_REASON_UNSUPPORTED = 5;
  DEVICE_REASON_MALFORMED_RESPONSE = 6;
  DEVICE_REASON_TRANSPORT_ERROR = 7;
  DEVICE_REASON_OWNERSHIP_UNCERTAIN = 8;
  DEVICE_REASON_NOT_IMPLEMENTED = 9;
  DEVICE_REASON_NOT_READY = 10;
  DEVICE_REASON_MISSING_TOOL = 11;
}

enum DeviceFeatureEvidence {
  DEVICE_FEATURE_EVIDENCE_UNSPECIFIED = 0;
  DEVICE_FEATURE_EVIDENCE_PROTOCOL = 1;
  DEVICE_FEATURE_EVIDENCE_REPORTED = 2;
  DEVICE_FEATURE_EVIDENCE_OBSERVED = 3;
  DEVICE_FEATURE_EVIDENCE_TESTED_PROVIDER = 4;
}

message DeviceFeatureScope {
  optional string model = 1;
  optional string firmware = 2;
  optional string transport = 3;
  optional uint32 density_code = 4;
}

message DeviceFeature {
  DeviceFeatureKind feature = 1;
  DeviceFeatureSupport support = 2;
  DeviceFeatureAvailability availability = 3;
  DeviceFeatureValidation validation = 4;
  DeviceReason reason = 5;
  string detail = 6;
  DeviceFeatureEvidence evidence = 7;
  DeviceFeatureScope scope = 8;
  oneof limits {
    TapeRecordLimits records = 17;
    TapeNavigationLimits navigation = 18;
    TapeCapacityLimits capacity = 19;
    TapeCompressionLimits compression = 20;
    TapeEncryptionLimits encryption = 21;
    TapeGeometryLimits geometry = 22;
  }
}

message TapeRecordLimits {
  optional uint32 minimum_bytes = 1;
  optional uint32 maximum_bytes = 2;
  optional uint32 alignment_bytes = 3;
  optional bool fixed = 4;
  optional bool variable = 5;
  optional uint32 transport_maximum_bytes = 6;
}

message TapeNavigationLimits {
  optional bool read_position_short = 1;
  optional bool read_position_long = 2;
  optional uint32 address_bits = 3;
}

// Current hardware algorithm observation and changeability of DCE or DDE, respectively.
// An algorithm identifier is not a supported-algorithm list or physical qualification.
message TapeCompressionLimits {
  optional uint32 current_algorithm = 1;
  optional bool enable_changeable = 2;
}

// Public algorithm identity and the current reader's device-local binding, never key material.
message TapeEncryptionAlgorithm {
  string name = 1;
  uint32 index = 2;
  uint32 key_bytes = 3;
}

// Non-secret current protocol facts; a key counter is not key-presence evidence.
message TapeEncryptionLimits {
  repeated TapeEncryptionAlgorithm algorithms = 1;
  optional uint32 current_algorithm_index = 2;
  optional uint32 encryption_mode = 3;
  optional uint32 decryption_mode = 4;
  optional uint32 i_t_nexus_scope = 5;
  optional uint32 key_scope = 6;
  optional uint32 parameters_control = 7;
  optional uint32 key_instance_counter = 8;
}

// Observed reporting form/count; neither establishes full-wrap coverage or freshness.
message TapeGeometryLimits {
  optional bool all_wraps = 1;
  optional uint32 reported_wraps = 2;
  optional bool fresh = 3;
  optional string source = 4;
}

enum TapeCapacityQuality {
  TAPE_CAPACITY_QUALITY_UNSPECIFIED = 0;
  TAPE_CAPACITY_QUALITY_ESTIMATE = 1;
  TAPE_CAPACITY_QUALITY_LOWER_BOUND = 2;
}

// Transient native-space observation before EW, independent of logical seek.
message TapeCapacityLimits {
  optional uint32 partition = 1;
  optional uint64 remaining_bytes = 2;
  TapeCapacityQuality quality = 3;
  optional int64 issued_at_ns = 4;
  optional int64 completed_at_ns = 5;
  // Absent allowances are unknown, not zero and not a complete-file-fit guarantee.
  optional uint64 observation_error_bytes = 6;
  optional uint64 unreflected_bytes = 7;
}

message TapeDeviceReport {
  optional bool medium_present = 1;
  optional bool write_protected = 2;
  optional uint32 density_code = 3;
  optional uint32 partition_count = 4;
  optional uint32 record_bytes = 5;
  optional bool fixed_records = 6;
  optional bool buffered_writes = 7;
  optional bool compression_enabled = 8;
  optional bool decompression_enabled = 9;
  // Current write encryption state; absent means it was not established.
  optional bool encryption_enabled = 10;
  repeated DeviceFeature features = 17;
  // Suggested FORMAT values only when applicable qualification establishes them.
  optional TarWriteOptions recommended_write_options = 18;
  string recommendation_detail = 19;
}
