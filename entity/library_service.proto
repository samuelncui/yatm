syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "tag.proto";

service LibraryService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse) {}
  rpc Trim(TrimLibraryRequest) returns (TrimLibraryResponse) {}
}

message ListTagsRequest {
  optional string prefix = 1;
  optional int64 limit = 2;
  optional string cursor = 3;
}

message ListTagsResponse {
  repeated Tag tags = 1;
  string next_cursor = 2;
}

message TrimLibraryRequest {
  bool trim_position = 1;
  bool trim_file = 2;
  bool dryrun = 3;
}

message TrimLibraryResponse {
  // Rows this call trimmed; under dryrun, those it would trim.
  int64 position_count = 1;
  int64 file_count = 2;
}
