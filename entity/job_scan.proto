syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "job.proto";
import "progress.proto";
import "file.proto";
import "media.proto";
import "storage.proto";
import "job_storage.proto";
import "location.proto";

service ScanJobService {
    rpc Create(CreateScanJobRequest) returns (CreateScanJobResponse) {}
    rpc GetCreation(GetScanJobCreationRequest) returns (GetScanJobCreationResponse) {}
    rpc ReadMedia(ReadScanMediaRequest) returns (ReadScanMediaResponse) {}
    rpc GetProgress(GetScanJobProgressRequest) returns (GetScanJobProgressResponse) {}
    rpc ListEntries(ListScanJobEntriesRequest) returns (ListScanJobEntriesResponse) {}
}

enum ScanChange {
    SCAN_CHANGE_UNSPECIFIED = 0;
    SCAN_CHANGE_ADDED = 1;
    SCAN_CHANGE_CHANGED = 2;
    SCAN_CHANGE_REMOVED = 3;
    SCAN_CHANGE_UNCHANGED = 4;
}

enum ScanSignaturePolicy {
    SCAN_SIGNATURE_POLICY_UNSPECIFIED = 0;
    SCAN_SIGNATURE_POLICY_FILL_MISSING = 1;
    SCAN_SIGNATURE_POLICY_KNOWN_ONLY = 2;
    SCAN_SIGNATURE_POLICY_FORCE_READ = 3;
}

enum ScanResultPolicy {
    SCAN_RESULT_POLICY_UNSPECIFIED = 0;
    SCAN_RESULT_POLICY_REPORT_ONLY = 1;
    SCAN_RESULT_POLICY_PUBLISH_ORIGINALS = 2;
    SCAN_RESULT_POLICY_PUBLISH_INVENTORY = 3;
    SCAN_RESULT_POLICY_VERIFY_COPIES = 4;
}

enum ScanFinding {
    SCAN_FINDING_UNSPECIFIED = 0;
    SCAN_FINDING_NOT_CHECKED = 1;
    SCAN_FINDING_MATCH = 2;
    SCAN_FINDING_MISMATCH = 3;
    SCAN_FINDING_MISSING = 4;
    SCAN_FINDING_UNREADABLE = 5;
    SCAN_FINDING_UNVERIFIABLE = 6;
}

enum ScanPreviewOutcome {
    SCAN_PREVIEW_OUTCOME_UNSPECIFIED = 0;
    SCAN_PREVIEW_OUTCOME_NOT_REQUESTED = 1;
    SCAN_PREVIEW_OUTCOME_READY = 2;
    SCAN_PREVIEW_OUTCOME_SKIPPED = 3;
    SCAN_PREVIEW_OUTCOME_FAILED = 4;
}

message ScanJobSpec {
    int64 media_id = 1;
    repeated FileSelection selections = 6;
    ScanSignaturePolicy signature_policy = 7;
    ScanResultPolicy result_policy = 8;
    bool compare_library = 9;
    PreviewPolicy preview_policy = 12;
}

message ScanEntry {
    string path = 1;
    ScanChange change = 2;
    int64 size_bytes = 3;
    uint32 mode = 4;
    int64 mtime_ns = 5;
    bytes sha256 = 6;
    int64 id = 7;
    int64 location_id = 8;
    bytes signature = 9;
    ObservedEntry before = 10;
    ObservedEntry after = 11;
    int64 position_id = 12;
    ScanFinding finding = 13;
    int64 actual_size_bytes = 14;
    bytes actual_hash = 15;
    int64 checked_at_ns = 16;
    string detail = 17;
    ScanPreviewOutcome preview = 19;
    string preview_error = 20;
    int64 matching_copies = 21;
    StoragePosition storage = 22;
}

message ReadScanMediaRequest { int64 id = 1; ReadMediaTarget target = 2; }
message ReadScanMediaResponse {}

message CreateScanJobRequest {
    int64 priority = 1;
    ScanJobSpec spec = 2;
}

message CreateScanJobResponse {
    Job job = 1;
}

message GetScanJobCreationRequest {
    int64 id = 1;
}

message GetScanJobCreationResponse {
    CreateScanJobRequest request = 1;
    // Nonempty when some original inputs cannot be recovered; request may be partial.
    string unavailable_reason = 2;
}

message GetScanJobProgressRequest {
    int64 id = 1;
}

message GetScanJobProgressResponse {
    Progress progress = 1;
    int64 added_count = 2;
    int64 changed_count = 3;
    int64 removed_count = 4;
    int64 processed_bytes = 5;
    int64 unchanged_count = 6;
    int64 matched_count = 7;
    int64 damaged_count = 8;
    int64 missing_count = 9;
    int64 unreadable_count = 10;
    int64 unverifiable_count = 11;
    int64 previews_ready_count = 12;
    int64 previews_skipped_count = 13;
    int64 previews_failed_count = 14;
}

message ListScanJobEntriesRequest {

    int64 id = 1;
    int32 limit = 2;
    optional int64 offset = 3;
    string cursor = 5;
    JobResultOrder order = 6;
    bool include_total = 7;
}

message ListScanJobEntriesResponse {
    repeated ScanEntry entries = 1;
    bool has_more = 2;
    optional int64 total_entry_count = 3;
}
