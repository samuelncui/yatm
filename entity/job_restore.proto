syntax = "proto3";
package job_restore;
option go_package = "github.com/samuelncui/yatm/entity";

import "copy_status.proto";
import "progress.proto";
import "job.proto";
import "job_storage.proto";
import "media.proto";

service RestoreJobService {
    rpc Create(CreateRestoreJobRequest) returns (CreateRestoreJobReply) {}
    rpc RestoreMedia(RestoreMediaRequest) returns (RestoreMediaReply) {}
    rpc GetProgress(GetRestoreJobProgressRequest) returns (GetRestoreJobProgressReply) {}
    rpc ListMedia(ListRestoreJobMediaRequest) returns (ListRestoreJobMediaReply) {}
    rpc ListFiles(ListRestoreJobFilesRequest) returns (ListRestoreJobFilesReply) {}
}

message RestoreFile {
    reserved 2, 3, 17, 18, 33;
    reserved "tape_id", "position_id", "status", "size", "tape_path";

    int64 file_id = 1;
    int64 file_version_id = 35;
    bytes hash = 19;
    string target_path = 34;
}

message RestoreCandidate {
    int64 id = 1;
    int64 media_id = 2;
    string media_path = 3;
}

message RestoreItem {
    int64 id = 1;
    copy_status.CopyStatus status = 2;
    int64 size = 3;
    RestoreFile file = 5;
    RestoreCandidate candidate = 6;
    int64 result_file_id = 7;
    bool damaged = 8;
    string result_message = 9;
    bool linked = 10;
    bytes actual_sha256 = 11;
    int64 actual_size = 12;
}

message CreateRestoreJobRequest {
    int64 priority = 1;
    yatm.job_storage.RestoreJobSpec spec = 2;
}

message CreateRestoreJobReply {
    job.Job job = 1;
}

message RestoreMediaRequest {
    int64 id = 1;
    media.ReadMediaTarget target = 2;
}

message RestoreMediaReply {}

message RestoreMedia {
    int64 media_id = 1;
    string identity = 2;
    int64 total = 3;
    copy_status.CopyStatus status = 17;
}

message GetRestoreJobProgressRequest {
    int64 id = 1;
}

message GetRestoreJobProgressReply {
    progress.Progress progress = 1;
    RestoreSummary summary = 2;
}

message RestoreSummary {
    int64 verified_files = 1;
    int64 damaged_files = 2;
    int64 unlinked_files = 3;
    int64 pending_files = 4;
}

message ListRestoreJobMediaRequest {
    int64 id = 1;
    int32 limit = 2;
    optional int64 offset = 3;
    repeated copy_status.CopyStatus filter_status = 4;
}

message ListRestoreJobMediaReply {
    repeated RestoreMedia media = 1;
    bool has_more = 2;
}

message ListRestoreJobFilesRequest {
    int64 id = 1;
    int64 media_id = 2;
    int32 limit = 3;
    optional int64 offset = 4;
    repeated copy_status.CopyStatus filter_status = 5;
}

message ListRestoreJobFilesReply {
    repeated RestoreItem items = 1;
}
