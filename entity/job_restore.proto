syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "copy_status.proto";
import "progress.proto";
import "job.proto";
import "job_storage.proto";
import "media.proto";
import "file.proto";
import "location.proto";

service RestoreJobService {
    rpc Estimate(EstimateRestoreJobRequest) returns (EstimateRestoreJobResponse) {}
    rpc Create(CreateRestoreJobRequest) returns (CreateRestoreJobResponse) {}
    rpc GetCreation(GetRestoreJobCreationRequest) returns (GetRestoreJobCreationResponse) {}
    rpc RestoreMedia(RestoreMediaRequest) returns (RestoreMediaResponse) {}
    rpc GetProgress(GetRestoreJobProgressRequest) returns (GetRestoreJobProgressResponse) {}
    rpc ListMedia(ListRestoreJobMediaRequest) returns (ListRestoreJobMediaResponse) {}
    rpc ListFiles(ListRestoreJobFilesRequest) returns (ListRestoreJobFilesResponse) {}
}

message EstimateRestoreJobRequest {
    repeated FileSelection selections = 1;
    repeated int64 file_version_ids = 2;
    RestoreDestination destination = 3;
    bool allow_damaged_copies = 4;
    RestoreVersionPolicy version_policy = 5;
    bool skip_unmatched_versions = 6;
}
message EstimateRestoreJobResponse { SelectionInspectionResult result = 1; }

message RestoreFile {

    int64 file_id = 1;
    int64 file_version_id = 35;
    bytes sha256 = 19;
    string target_path = 34;
}

message RestoreCandidate {
    int64 id = 1;
    int64 media_id = 2;
    string media_path = 3;
}

message RestoreItem {
    int64 id = 1;
    CopyStatus status = 2;
    int64 size_bytes = 3;
    RestoreFile file = 5;
    RestoreCandidate candidate = 6;
    int64 result_file_id = 7;
    bool damaged = 8;
    string result_message = 9;
    bool linked = 10;
    bytes actual_sha256 = 11;
    int64 actual_size_bytes = 12;
}

message CreateRestoreJobRequest {
    int64 priority = 1;
    RestoreJobSpec spec = 2;
}

message CreateRestoreJobResponse {
    Job job = 1;
}

message GetRestoreJobCreationRequest {
    int64 id = 1;
}

message GetRestoreJobCreationResponse {
    CreateRestoreJobRequest request = 1;
    // Nonempty when some original inputs cannot be recovered; request may be partial.
    string unavailable_reason = 2;
}

message RestoreMediaRequest {
    int64 id = 1;
    ReadMediaTarget target = 2;
}

message RestoreMediaResponse {}

message RestoreMedia {
    int64 media_id = 1;
    string identity = 2;
    int64 file_count = 3;
    CopyStatus status = 17;
}

message GetRestoreJobProgressRequest {
    int64 id = 1;
}

message GetRestoreJobProgressResponse {
    Progress progress = 1;
    RestoreSummary summary = 2;
}

message RestoreSummary {
    int64 verified_files = 1;
    int64 damaged_files = 2;
    int64 unlinked_files = 3;
    int64 pending_files = 4;
}

message ListRestoreJobMediaRequest {
    int64 id = 1;
    int32 limit = 2;
    optional int64 offset = 3;
    repeated CopyStatus filter_status = 4;
    string cursor = 5;
    JobResultOrder order = 6;
    bool include_total = 7;
}

message ListRestoreJobMediaResponse {
    repeated RestoreMedia media = 1;
    bool has_more = 2;
    optional int64 total_media_count = 3;
}

message ListRestoreJobFilesRequest {
    int64 id = 1;
    optional int64 media_id = 2;
    int32 limit = 3;
    optional int64 offset = 4;
    repeated CopyStatus filter_status = 5;
    string cursor = 6;
    JobResultOrder order = 7;
    bool include_total = 8;
}

message ListRestoreJobFilesResponse {
    repeated RestoreItem items = 1;
    bool has_more = 2;
    optional int64 total_file_count = 3;
}
