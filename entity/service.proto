syntax = "proto3";
package service;
option go_package = "github.com/samuelncui/yatm/entity";

import "file.proto";
import "position.proto";
import "media.proto";
import "preview.proto";
import "tag.proto";

service Service {
    rpc FileGet(FileGetRequest) returns (FileGetReply) {}
    rpc FileListParents(FileListParentsRequest) returns (FileListParentsReply) {}
    rpc FileMetadataEdit(FileMetadataEditRequest) returns (FileMetadataEditReply) {}
    rpc FileSearch(FileSearchRequest) returns (FileSearchReply) {}
    rpc TagList(TagListRequest) returns (TagListReply) {}

    rpc MediaList(MediaListRequest) returns (MediaListReply) {}
    rpc MediaInspect(MediaInspectRequest) returns (MediaInspectReply) {}
    rpc MediaDelete(MediaDeleteRequest) returns (MediaDeleteReply) {}
    rpc MediaGetPositions(MediaGetPositionsRequest) returns (MediaGetPositionsReply) {}
    rpc VolumeInitialize(VolumeInitializeRequest) returns (VolumeInitializeReply) {}
    rpc VolumeRegister(VolumeRegisterRequest) returns (VolumeRegisterReply) {}

    rpc DeviceList(DeviceListRequest) returns (DeviceListReply) {}

    rpc LibraryTrim(LibraryTrimRequest) returns (LibraryTrimReply) {}
}

message FileGetRequest {
    int64 id = 1;

    file.FileScope scope = 2;
    string cursor = 3;
    int32 limit = 4;

    optional bool need_size = 17;
}

message FileGetReply {
    reserved 2;
    reserved "positions";

    optional file.File file = 1;
    repeated file.File children = 17;
    optional preview.PreviewManifest preview = 19;
    string next_cursor = 20;
    file.FileScope scope = 21;
}

message FileListParentsRequest {
    int64 id = 1;
}

message FileListParentsReply {
    repeated file.File parents = 1;
}

message FileMetadataEditRequest {
    repeated int64 ids = 1;
    repeated string add_tags = 2;
    repeated string remove_tags = 3;
    optional string note = 4;
}

message FileMetadataEditReply {
}

message FileSearchRequest {
    string query = 1;
    optional int64 limit = 2;
    optional string cursor = 3;
    file.FileScope scope = 4;
    int64 location_id = 5;
    int64 location_revision = 6;
}

message FileSearchResult {
    file.File file = 1;
    string path = 2;
}

message FileSearchReply {
    repeated FileSearchResult results = 1;
    string next_cursor = 2;
}

message TagListRequest {
    optional string prefix = 1;
    optional int64 limit = 2;
    optional string cursor = 3;
}

message TagListReply {
    repeated tag.Tag tags = 1;
    string next_cursor = 2;
}

message MediaListRequest {
    oneof param {
        MediaMGetRequest mget = 1;
        media.MediaFilter list = 2;
    }
}

message MediaMGetRequest {
    repeated int64 ids = 1;
}

message MediaListReply {
    repeated media.Media media = 1;
    bool has_more = 2;
}

message MediaInspectRequest {
    oneof target {
        MediaInspectTapeTarget tape = 1;
        MediaInspectVolumeTarget volume = 2;
    }
    optional string identity = 17;
}

message MediaInspectTapeTarget {
    string device = 1;
}

message MediaInspectVolumeTarget {
    string uuid = 1;
}

message MediaInspectReply {
    string identity = 1;
    optional media.Media media = 2;
    int64 file_count = 3;
    optional int64 last_write_time = 4;
    optional string mount_point = 5;
}

message MediaDeleteRequest {
    repeated int64 ids = 1;
}

message MediaDeleteReply {
}

message MediaGetPositionsRequest {
    int64 id = 1;
    string directory = 2;
    optional int64 limit = 33;
    optional string after_path = 34;
}

message MediaGetPositionsReply {
    repeated position.Position positions = 1;
    bool has_more = 2;
}

message VolumeInitializeRequest {
    string mount_point = 1;
    string name = 2;
    media.VolumeMediaProfile profile = 3;
}

message VolumeInitializeReply {
    media.Media media = 1;
}

message VolumeRegisterRequest {
    string mount_point = 1;
    string name = 2;
}

message VolumeRegisterReply {
    media.Media media = 1;
}

message DeviceListRequest {}

message DeviceListReply {
    repeated string devices = 1;
}

message LibraryTrimRequest {
    bool trim_position = 1;
    bool trim_file = 2;
}

message LibraryTrimReply {
}
