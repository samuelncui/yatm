syntax = "proto3";

package yatm.v1;

option go_package = "github.com/samuelncui/yatm/entity;entity";

message LtfsExtent {
  string partition = 1;
  uint64 start_block = 2;
  uint64 byte_offset = 3;
  uint64 byte_count = 4;
  uint64 file_offset_bytes = 5;
}

message LtfsMetadata {
  repeated LtfsExtent extents = 1;
}

message StorageMetadata {
  oneof backend {
    LtfsMetadata ltfs = 1;
  }
}

message StoragePosition {
  bytes order = 1;
  StorageMetadata metadata = 2;
}
