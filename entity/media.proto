syntax = "proto3";

package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

enum MediaKind {
    MEDIA_KIND_UNSPECIFIED = 0;
    MEDIA_KIND_TAPE = 1;
    MEDIA_KIND_VOLUME = 2;
}

enum MediaAccess {
    MEDIA_ACCESS_UNSPECIFIED = 0;
    MEDIA_ACCESS_CONCURRENT_RANDOM = 1;
    MEDIA_ACCESS_RANDOM = 2;
    MEDIA_ACCESS_SEQUENTIAL = 3;
}

enum VolumeType {
    VOLUME_TYPE_UNSPECIFIED = 0;
    VOLUME_TYPE_HDD = 1;
    VOLUME_TYPE_HM_SMR = 2;
}

enum ArchiveTapeWriteMode {
    ARCHIVE_TAPE_WRITE_MODE_UNSPECIFIED = 0;
    ARCHIVE_TAPE_WRITE_MODE_FORMAT = 1;
    ARCHIVE_TAPE_WRITE_MODE_APPEND = 2;
}

message Capabilities {
    MediaAccess read = 1;
    MediaAccess write = 2;
}

message TapeMediaProfile {
    string serial_number = 1;
    string encryption = 2;
    string format = 3;
    optional TarMediaProfile tar = 4;
}

enum TapeRecordMode {
    TAPE_RECORD_MODE_UNSPECIFIED = 0;
    TAPE_RECORD_MODE_FIXED = 1;
    TAPE_RECORD_MODE_VARIABLE = 2;
}

// FORMAT freezes the record policy and hardware choices for one tar cartridge initialization.
message TarMediaProfile {
    string initialization_id = 1;
    TapeRecordMode record_mode = 2;
    uint32 record_bytes = 3;
    bool hardware_compression = 4;
    // Optional observed public algorithm; the separately retained key controls script preparation.
    optional string encryption_algorithm = 5;
}

// Presence distinguishes an omitted default from an explicit false hardware choice.
message TarWriteOptions {
    optional TapeRecordMode record_mode = 1;
    optional uint32 record_bytes = 2;
    optional bool hardware_compression = 3;
}

message VolumeMediaProfile {
    string serial_number = 1;
    VolumeType type = 2;
}

message MediaProfile {
    oneof kind {
        TapeMediaProfile tape = 1;
        VolumeMediaProfile volume = 2;
    }
}

enum TapePositionDirection {
    TAPE_POSITION_DIRECTION_UNSPECIFIED = 0;
    TAPE_POSITION_DIRECTION_FORWARD = 1;
    TAPE_POSITION_DIRECTION_REVERSE = 2;
}

enum TapePositionEndpointConvention {
    TAPE_POSITION_ENDPOINT_CONVENTION_UNSPECIFIED = 0;
    TAPE_POSITION_ENDPOINT_CONVENTION_INCLUSIVE = 1;
    TAPE_POSITION_ENDPOINT_CONVENTION_EXCLUSIVE = 2;
}

// Logical coverage is partition-scoped; absent EOD remains unknown.
message TapePositionPartition {
    uint32 partition = 1;
    uint64 bot = 2;
    optional uint64 eod = 3;
}

// Wraps retain declared traversal order and missing endpoints rather than filling gaps.
message TapePositionWrap {
    uint32 partition = 1;
    uint32 wrap = 2;
    uint32 band = 3;
    TapePositionDirection direction = 4;
    bool full = 5;
    optional uint64 endpoint = 6;
    // A partial wrap keeps its actual EOD; this is only its interpolation denominator.
    optional uint64 estimated_span_objects = 7;
    optional uint64 endpoint_uncertainty_objects = 8;
}

// Mutable derived geometry belongs to Media, independently of its immutable profile.
// Exactly one initialization binding is present: tar initialization_id, or LTFS UUID/index.
message TapePositionMap {
    string initialization_id = 1;
    string ltfs_uuid = 2;
    optional uint64 ltfs_index_generation = 3;
    repeated TapePositionPartition partitions = 4;
    repeated TapePositionWrap wraps = 5;
    TapePositionEndpointConvention endpoint_convention = 6;
    string source = 7;
    optional uint64 min_lpos = 8;
    optional uint64 max_lpos = 9;
    int64 observed_at_ns = 10;
}

message Media {

    int64 id = 1;
    MediaKind kind = 2;
    string identity = 3;
    string name = 4;
    Capabilities capabilities = 6;
    MediaProfile profile = 9;

    int64 created_at_ns = 17;
    optional int64 destroyed_at_ns = 18;
    int64 capacity_bytes = 19;
    int64 written_bytes = 20;
    optional bool mounted = 21;
    optional int64 filesystem_available_bytes = 22;
    optional TapePositionMap tape_position_map = 23;
    // Responses omit profile.tape.encryption; this reports whether the Library retains that key.
    bool encryption_key_saved = 24;
}

message MediaFilter {
    repeated MediaKind kinds = 1;
    // Literal, case-insensitive substring of the Media name or identity.
    string query = 2;
    optional int64 limit = 33;
    optional int64 offset = 34;
    // Selects ID-ascending pagination; use zero for its first page. Exclusive with offset.
    optional int64 after_id = 35;
}

message ArchiveTapeTarget {
    string device = 1;
    string barcode = 2;
    string name = 3;
    ArchiveTapeWriteMode mode = 4;
    optional string format = 5;
    optional TarWriteOptions tar_options = 6;
}

message ArchiveVolumeTarget {
    string uuid = 1;
}

message ArchiveMediaTarget {
    oneof backend {
        ArchiveTapeTarget tape = 1;
        ArchiveVolumeTarget volume = 2;
    }
}

message ReadTapeTarget {
    string device = 1;
    // Optional selection from the Job's frozen candidates; the Session still proves identity.
    optional int64 media_id = 2;
    // Explicit qualified preparation for tar Restore and VERIFY_COPIES only.
    bool refresh_position_map = 3;
}

message ReadVolumeTarget {
    string uuid = 1;
}

message ReadMediaTarget {
    oneof backend {
        ReadTapeTarget tape = 1;
        ReadVolumeTarget volume = 2;
    }
    // Populated from the frozen Job manifest by the runner, never trusted from a client.
    int64 expected_media_id = 3;
    string expected_identity = 4;
    MediaProfile expected_profile = 5;
}
