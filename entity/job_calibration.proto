syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "job.proto";
import "settings.proto";

service CalibrationJobService {
    rpc Create(CreateCalibrationJobRequest) returns (CreateCalibrationJobResponse) {}
    rpc GetProgress(GetCalibrationJobProgressRequest) returns (GetCalibrationJobProgressResponse) {}
}

// CalibrationJobSpec names the configured Tape device. The Job calibrates on what the loaded
// cartridge holds, or on test data it writes first.
message CalibrationJobSpec {
    string device = 1;
    // Overwrites the loaded cartridge from the beginning of tape with test data and calibrates on
    // it. A cartridge registered as Media is refused.
    bool write_test_data = 3;
}

// CalibrationMove is one measured LOCATE. A position is a wrap and the longitudinal fraction of
// one span measured from the beginning-of-tape end.
message CalibrationMove {
    uint32 from_wrap = 1;
    double from_span = 2;
    uint32 to_wrap = 3;
    double to_span = 4;
    double seconds = 5;
}

message CreateCalibrationJobRequest {
    CalibrationJobSpec spec = 1;
}

message CreateCalibrationJobResponse {
    Job job = 1;
}

message GetCalibrationJobProgressRequest {
    int64 id = 1;
}

message GetCalibrationJobProgressResponse {
    Job job = 1;
    CalibrationJobSpec spec = 2;
    // Moves measured so far, in order.
    repeated CalibrationMove moves = 3;
    uint32 total_moves = 4;
    // The fitted read parameters, present once the moves were fitted.
    optional TapeReadParameters parameters = 5;
    // Latest execution attempt, excluding time waiting between attempts. Absent when unknown.
    optional int64 elapsed_ms = 6;
}
