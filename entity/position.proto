syntax = "proto3";
package position;
option go_package = "github.com/samuelncui/yatm/entity";

enum PositionHealth {
    POSITION_HEALTH_UNKNOWN = 0;
    HEALTHY = 1;
    DAMAGED = 2;
    MISSING = 3;
    UNREADABLE = 4;
}

message Position {
    reserved 2;
    reserved "file_id";
    int64 id = 1;
    int64 media_id = 3;
    string path = 4;

    int64 mode = 17;
    int64 mod_time = 18;
    int64 write_time = 19;
    int64 size = 20;
    bytes hash = 21;
    bytes signature = 22;
    PositionHealth health = 23;
    int64 checked_at_ms = 24;
    int64 health_job_id = 25;
}
