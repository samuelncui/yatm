syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

enum PositionHealth {
    POSITION_HEALTH_UNSPECIFIED = 0;
    POSITION_HEALTH_UNKNOWN = 1;
    POSITION_HEALTH_HEALTHY = 2;
    POSITION_HEALTH_DAMAGED = 3;
    POSITION_HEALTH_MISSING = 4;
    POSITION_HEALTH_UNREADABLE = 5;
}

message Position {
    int64 id = 1;
    int64 media_id = 3;
    string path = 4;

    int64 mode = 17;
    int64 mtime_ns = 18;
    int64 written_at_ns = 19;
    int64 size_bytes = 20;
    bytes sha256 = 21;
    bytes signature = 22;
    PositionHealth health = 23;
    int64 checked_at_ns = 24;
    int64 health_job_id = 25;
}
