syntax = "proto3";
package yatm.v1;
option go_package = "github.com/samuelncui/yatm/entity;entity";

import "file.proto";
import "job_storage.proto";
import "source.proto";

service LocationService {
  rpc Create(CreateLocationRequest) returns (CreateLocationResponse) {}
  rpc List(ListLocationsRequest) returns (ListLocationsResponse) {}
  rpc Get(GetLocationRequest) returns (GetLocationResponse) {}
  rpc Update(UpdateLocationRequest) returns (UpdateLocationResponse) {}
  rpc Delete(DeleteLocationRequest) returns (DeleteLocationResponse) {}
  rpc GetAccess(GetLocationAccessRequest) returns (GetLocationAccessResponse) {}
  rpc BrowsePaths(BrowsePathsRequest) returns (BrowsePathsResponse) {}
}

message AccessRange { string root_path = 1; string ignore = 2; }
message GetLocationAccessRequest {}
message GetLocationAccessResponse {
  repeated AccessRange ranges = 1;
}
// Administrator discovery of unregistered paths. An empty path lists authorized roots.
message BrowsePathsRequest {
  string path = 1;
  string cursor = 2;
  int32 limit = 3;
}
message BrowsePathsResponse {
  string path = 1;
  repeated SourceFile directories = 2;
  string next_cursor = 3;
}
// IgnoreRules keeps one Location's gitignore text verbatim.
message IgnoreRules {
  string format = 2;
  string text = 3;
}

// LocationAccessibility is one timed observation of a Location's reachability.
message LocationAccessibility {
  bool accessible = 1;
  int64 checked_at_ns = 2;
  string error = 3;
}

// ObservedEntry is what one read saw for one entry of a Location, before or independent of the
// recorded FileLocation: the input a Scan publishes and the before/after facts of its result.
// It carries no identity of its own - file_id is the association the read matched, and zero when
// it matched none.
message ObservedEntry {
  string path = 3;
  bool directory = 5;
  int64 file_id = 6;
  int64 size_bytes = 7;
  uint32 mode = 8;
  int64 mtime_ns = 9;
  bytes sha256 = 10;
  bytes signature = 11;
}

message Location {
  int64 id = 1;
  string name = 2;
  string executor_id = 3;
  string root_path = 4;
  int64 revision = 8;
  int64 created_at_ns = 9;
  int64 updated_at_ns = 10;
  int64 last_sync_at_ns = 11;
  int64 last_sync_job_id = 12;
  int64 last_job_id = 13;
  bool restore_target = 15;
  LocationConfig config = 16;
}

message FileLocation {
  int64 file_id = 1;
  int64 location_id = 2;
  string path = 3;
  string parent_path = 4;
  int64 size_bytes = 5;
  uint32 mode = 6;
  int64 mtime_ns = 7;
  bytes signature = 8;
  bytes sha256 = 9;
}

message LocationRef {
  int64 id = 1;
}
message LocationEntryQuery { int64 location_id = 1; string path = 2; }
message CreateLocationRequest { Location location = 1; }
message UpdateLocationRequest { Location location = 1; }
message GetLocationRequest { int64 id = 1; }
message DeleteLocationRequest {
  int64 id = 1;
  bool dryrun = 2;
}
message DeleteLocationResponse {
  // Locations this call unregistered; under dryrun, those it would unregister.
  int64 location_count = 1;
  // Recorded original associations removed with them; under dryrun, those it would remove.
  int64 original_count = 2;
}
message CreateLocationResponse {
  Location location = 1;
  LocationAccessibility accessibility = 2;
  repeated string warnings = 4;
}
message GetLocationResponse {
  Location location = 1;
  LocationAccessibility accessibility = 2;
  repeated string warnings = 4;
}
message UpdateLocationResponse {
  Location location = 1;
  LocationAccessibility accessibility = 2;
  repeated string warnings = 4;
}
message ListLocationsRequest {
  int64 after_id = 1;
  int32 limit = 2;
  optional bool restore_target = 3;
  // Literal, case-insensitive substring of the Location name or root path.
  string query = 4;
}
message ListLocationsResponse { repeated Location locations = 1; bool has_more = 2; }
message LocationEntriesQuery {
  int64 location_id = 1;
  string parent_path = 2;
  int32 limit = 4;
  string cursor = 6;
  string name_filter = 7;
}
message LocationEntry {
  string path = 1;
  bool directory = 2;
  FileLocation original = 3;
  File file = 4;
  LocationEntryRef reference = 5;
}
message LocationEntriesPage {
  repeated LocationEntry entries = 1;
  bool has_more = 2;
  int64 revision = 3;
  string next_cursor = 4;
}

// Metadata-only preview; Job indexing remains the authoritative frozen manifest.
message SelectionInspection {
  repeated FileSelection selections = 1;
  repeated int64 file_version_ids = 2;
  bool restore = 3;
  RestoreDestination destination = 4;
  bool allow_damaged_copies = 5;
  RestoreVersionPolicy version_policy = 6;
  bool skip_unmatched_versions = 7;
}
message SelectionInspectionResult {
  int64 file_count = 1;
  int64 total_bytes = 2;
  int64 missing_original_count = 4;
  int64 missing_copy_count = 5;
  repeated FileSelection selections = 7;
  int64 unknown_size_file_count = 8;
  int64 ignored_output_count = 9;
  int64 unmatched_version_count = 10;
  int64 skipped_version_count = 11;
  // Bounded to explicitly selected regular Files/versions, never expanded directory descendants.
  repeated RestoreVersionResolution resolved_versions = 12;
}

enum RestoreVersionMatch {
  RESTORE_VERSION_MATCH_UNSPECIFIED = 0;
  RESTORE_VERSION_MATCH_MATCHED = 1;
  RESTORE_VERSION_MATCH_NO_SAVED_VERSION = 2;
  RESTORE_VERSION_MATCH_AFTER_CUTOFF = 3;
  RESTORE_VERSION_MATCH_DATE_UNKNOWN = 4;
}

message RestoreVersionResolution {
  int64 file_id = 1;
  FileVersion version = 2;
  optional int64 archived_at_ns = 3;
  RestoreVersionMatch match = 4;
}

message LocationConfig {
  IgnoreRules ignore = 1;
  bool use_mmap = 3;
}
