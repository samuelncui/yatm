title = "YATM public content checks"

[extend]
useDefault = true

# The public Go checksum database verifies this module hash; its path contains "token".
[[allowlists]]
description = "modernc.org/token v1.1.0 public module checksum"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)go\.sum$''']
regexTarget = "secret"
regexes = ['''^Xl7Ap9dKaEs5kLoOQeQmPWevfnk/DM5qcLcYlA8ys6Y=?$''']

# This fixed key produces repeatable high-entropy physical-Tape test data; it protects no data.
[[allowlists]]
description = "Deterministic EOM fixture seed only"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)e2e/testdata/generate-physical-eom\.sh$''']
regexTarget = "secret"
regexes = ['''^7df4fd97a80957d40e8a0be64ffb54f503f857407132bee657fee95fe2ee88c3$''']

# These are public identifiers in the exact dependency sources validated by the package checks.
[[allowlists]]
description = "LibRaw 0.22.2 changelog compiler define"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''!LibRaw-0\.22\.2\.tar\.gz!LibRaw-0\.22\.2/Changelog\.txt$''']
regexTarget = "secret"
regexes = ['''^LIBRAW_WIN32_DLLDEFS$''']

[[allowlists]]
description = "FFmpeg 8.0 HSV filter function name"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''!ffmpeg-8\.0\.tar\.xz!ffmpeg-8\.0/libavfilter/vf_hsvkey\.c$''']
regexTarget = "secret"
regexes = ['''^do_hsvkey16_slice$''']

# The pinned upstream FATE reference records a public sample path; no workstation path is exempted.
[[allowlists]]
description = "FFmpeg 8.0 public FATE reference path"
targetRules = ["personal-build-path"]
condition = "AND"
paths = ['''!ffmpeg-8\.0\.tar\.xz!ffmpeg-8\.0/tests/ref/fate/mxf-probe-dnxhd$''']
regexTarget = "match"
regexes = ['''^[/]Users[/]mark[/]$''']

[[rules]]
id = "personal-build-path"
description = "Personal filesystem path in distributed content"
regex = '''(?:/(?:Users|home)/[A-Za-z0-9_.-]+/|/(?:private/)?var/folders/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/)'''

[[rules]]
id = "private-service-url"
description = "Private service reference in public source or packages"
regex = '''(?:https?|ssh)://(?:[A-Za-z0-9_-]+\.)*(?:byted\.org|bytedance\.net|byteintl\.net|corp|internal)(?:[:/\s]|$)'''

# Verified public upstream metadata and fixtures. Exact source archives/modules are validated before release.

